const {tools,categories,weeks,nav,platforms}=DATA;
const ICONS={overview:'▦',tools:'◈',platforms:'⌖',labs:'⌬',workflows:'↬',reports:'▤',settings:'⚙'};
const state={platformFilter:'all',targetPlatform:'portswigger',page:location.hash.slice(1)||'overview',category:'all',term:'',palette:false,paletteTerm:'',tool:null,expanded:1,workflow:'identity',mobile:false,reset:false};
const workflows=[{id:'identity',tag:'IDENTITY',title:'مراجعة هوية المؤسسة',desc:'تقييم علاقات الامتيازات وقوالب الشهادات.',tools:['bloodhound','certipy','impacket'],icon:'◇'},{id:'detection',tag:'PURPLE TEAM',title:'قياس الرصد والاستجابة',desc:'اختبارات تغطية ATT&CK الدفاعية.',tools:['caldera','sliver','mythic'],icon:'◎'},{id:'research',tag:'RESEARCH',title:'دورة أبحاث الثغرات',desc:'من تفكيك برنامج تجريبي إلى تحليل التعطل.',tools:['ghidra','afl','syzkaller'],icon:'✣'}];
function get(k,def){try{const raw=localStorage.getItem(k);return raw?JSON.parse(raw):def}catch{return def}}
let targets=get('star-range-assigned-targets',[]), completed=get('star-range-weeks',[]), favorites=get('star-range-favorites',[]), notes=get('star-range-notes',''), motion=get('star-range-reduced-motion',false), compact=get('star-range-compact',false);
const save=()=>{try{localStorage.setItem('star-range-assigned-targets',JSON.stringify(targets));localStorage.setItem('star-range-weeks',JSON.stringify(completed));localStorage.setItem('star-range-favorites',JSON.stringify(favorites));localStorage.setItem('star-range-notes',JSON.stringify(notes));localStorage.setItem('star-range-reduced-motion',JSON.stringify(motion));localStorage.setItem('star-range-compact',JSON.stringify(compact))}catch{}};
const esc=(s)=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const progress=()=>Math.round(completed.length/weeks.length*100);
function go(page){state.page=page;state.mobile=false;state.palette=false;location.hash=page;render();window.scrollTo({top:0,behavior:'instant'})}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render()}
function toggleWeek(n){completed=completed.includes(n)?completed.filter(x=>x!==n):[...completed,n];save();render()}
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2500)}
function copy(s){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>toast('تم نسخ الأمر')).catch(()=>prompt('انسخ النص:',s))}else{prompt('انسخ النص:',s)}}
function dl(name,s,typ){const blob=new Blob([s],{type:typ});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('تم تجهيز الملف')}
function markdown(){return '# STAR CYBER RANGE — سجل التدريب\n\nتقدم محلي، ليس تقرير فحص أمني حقيقي.\n\n'+weeks.map(w=>`- [${completed.includes(w.number)?'x':' '}] ${w.title}`).join('\n')+'\n\n## ملاحظات\n'+notes+'\n\n## مختبرات مسجلة يدوياً\n'+targets.map(t=>'- '+t.title+' — '+t.endpoint).join('\n')}
function button(type,label,args='',clazz=''){return `<button ${type} class="${clazz}">${label}</button>`}
const pill=(label,kind='muted')=>`<span class="pill pill-${kind}">${label}</span>`;
const heading=(a,b,desc='',act='')=>`<div class="section-heading" data-animate><div><span class="eyebrow">${a}</span><h2>${b}</h2>${desc?`<p>${desc}</p>`:''}</div>${act}</div>`;
const action=(page,title)=>`<button class="text-action" data-go="${page}">${title} ←</button>`;
function sidebar(){return `<aside class="sidebar ${state.mobile?'sidebar-open':''}"><div class="brand" data-go="overview"><div class="brand-mark">◈<span></span></div><div class="brand-type"><strong>STAR<span> / </span>CYBER</strong><small>RANGE OPERATIONS</small></div></div><div class="sidebar-label">WORKSPACE <span>01</span></div><nav class="side-nav">${nav.slice(0,5).map(n=>navBtn(n)).join('')}</nav><div class="sidebar-label label-second">OPERATIONS</div><nav class="side-nav">${nav.slice(5).map(n=>navBtn(n)).join('')}</nav><div class="sidebar-bottom"><div class="side-promo"><div class="promo-glow"></div><span class="side-promo-tag">✧ LEARNING PATH</span><strong>رحلتك الأمنية تبدأ هنا.</strong><p>8 أسابيع من التدريب العملي المنظم.</p><button data-go="labs">ابدأ التدريب ←</button></div><div class="side-system"><span class="sys-status"></span><div><strong>وضع التدريب</strong><small>بيانات محلية · لا يوجد Backend</small></div>ⓘ</div></div></aside>`}

function workflowsPage(){const w=workflows.find(w=>w.id===state.workflow)||workflows[0];return `<div class="page-meta"><span>BLUEPRINTS / PRESET FLOWS</span><span>03 / 05</span></div>${heading('OPERATION BLUEPRINTS','مسارات عمل، مو أوامر عشوائية.','اختر نوع المهمة وشاهد ترتيب الأدوات المقترح.')}<div class="workflow-grid">${workflows.map(w=>`<button class="workflow-card ${w.id===state.workflow?'selected':''}" data-workflow="${w.id}"><span class="icon-badge tone-mint icon-large">${w.icon}</span><span class="workflow-tag">${w.tag}</span><h3>${w.title}</h3><p>${w.desc}</p><div class="workflow-bottom"><span>${w.tools.length} مراحل</span>↗</div></button>`).join('')}</div><div class="panel workflow-details"><div class="workflow-header"><div><span class="eyebrow">SELECTED WORKFLOW</span><h3>${w.title}</h3><p>هذا مسار تدريب فقط؛ لا ينفّذ أي فحص مباشر.</p></div><button class="outline-button" data-copyworkflow="${w.id}">نسخ المخطط</button></div><div class="workflow-timeline">${w.tools.map((id,i)=>{const t=tools.find(t=>t.id===id);return `<div class="workflow-step"><div class="workflow-line-num">0${i+1}</div><div><span>${t.category}</span><h4>${t.name}</h4><p>${t.outcome}</p></div><button data-tool="${id}">↗</button></div>`}).join('')}</div></div>`}
function platformPage(){const shown=platforms.filter(p=>state.platformFilter==='all'||p.kind===state.platformFilter);const current=platforms.find(p=>p.id===state.targetPlatform)||platforms[0];return `<div class="page-meta"><span>AUTHORIZED LABS / 10 PLATFORMS</span><span>TRAINING SCOPE</span></div>${heading('CHOOSE YOUR LAB','منصات التدريب والأهداف المخصصة','المواقع مصادر تمارين وليست أهداف اختراق. سجّل فقط عنوان الـMachine أو الـLab المخصص لك.')}<div class="scope-banner" data-animate><span>♧</span><div><strong>قاعدة النطاق الأمني</strong><p>المسموح هو المختبر أو الجهاز المعيّن لك حسب شروط المنصة، وليس الموقع الرئيسي أو API الإدارة. الموقع لا ينفّذ أي فحوص تلقائية.</p></div>${pill('ASSIGNED LABS ONLY','mint')}</div><div class="target-stats" data-animate><div><strong>10</strong><span>منصات</span></div><div><strong>${targets.length}</strong><span>مختبرات مسجلة</span></div><div><strong>${targets.filter(t=>t.status==='done').length}</strong><span>مكتمل</span></div></div><div class="platform-toolbar"><strong>تصفّح المنصات</strong><div class="filter-chips">${[['all','الكل'],['offense','هجومي'],['mixed','متنوع'],['defense','دفاعي']].map(([id,label])=>`<button class="filter-chip ${state.platformFilter===id?'selected':''}" data-platformfilter="${id}">${label}</button>`).join('')}</div></div><div class="platform-grid">${shown.map((p,i)=>`<article class="platform-card" data-animate><div class="platform-top"><span class="platform-order">${String(i+1).padStart(2,'0')}</span><span class="platform-kind kind-${p.kind}">${p.badge}</span></div><div class="platform-emblem">⌖</div><h3>${esc(p.name)}</h3><small>${esc(p.focus)}</small><p>${esc(p.details)}</p><div class="platform-scope">♧ ${esc(p.scope)}</div><div class="platform-actions"><a class="outline-button" href="${p.url}" target="_blank" rel="noopener noreferrer">فتح المنصة ↗</a><button class="primary-button" data-platformselect="${p.id}">سجّل مختبر ←</button></div></article>`).join('')}</div><section class="panel target-register" tion value="done" ${t.status==='done'?'selected':''}>مكتمل يدوياً</option></select>${t.endpoint?`<button class="outline-button" data-targetcopy="${esc(t.id)}" aria-label="نسخ العنوان">⧉</button>`:''}<button class="outline-button remove-target" data-targetdelete="${esc(t.id)}" aria-label="حذف">✕</button></div></div>`).join('')}</div>`}</section>`}
function checkAssignedTarget(p,title,endpoint){if(title.trim().length<3||title.length>90)return 'اسم المختبر يجب أن يكون 3 إلى 90 حرفاً.';if(p.kind==='defense')return '';let raw=endpoint.trim();if(!raw||raw.length>240||/[\s\u0000-\u001f`$|;&<>{}\\]/.test(raw))return 'أدخل عنوان IP أو URL المختبر المخصص، وليس أمر Shell.';let host;try{let u=new URL(/^https?:\/\//i.test(raw)?raw:'http://'+raw);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)throw Error('invalid');host=u.hostname.toLowerCase().replace(/\.$/,'')}catch{return 'عنوان المختبر غير صالح.'}const sites=['portswigger.net','hackthebox.com','tryhackme.com','pentesterlab.com','root-me.org','overthewire.org','picoctf.org','vulnhub.com','cyberdefenders.org','blueteamlabs.online'];if(sites.some(d=>[d,'www.'+d,'app.'+d,'api.'+d].includes(host)))return 'هذا موقع المنصة الرئيسي، وليس عنوان التحدي المسند إليك.';return ''}

function overlay(){if(state.tool){const t=tools.find(t=>t.id===state.tool);if(t)return `<div class="modal-overlay" data-overlay><section class="tool-modal" role="dialog" aria-modal="true"><div class="modal-header"><div><span class="eyebrow">TOOL / ${t.category}</span><h2>${t.name}</h2></div><button class="icon-button" data-close="1">✕</button></div><div class="modal-content"><div class="modal-intro"><div class="modal-symbol">${t.icon}</div><p>${t.desc}</p></div><h3>◎ نتيجة تدريب مستهدفة</h3><p class="modal-outcome">${t.outcome}</p><h3>⌘ أمر تمهيدي</h3><div class="command-box" dir="ltr"><code>${esc(t.command)}</code><button data-copy="${esc(t.id)}">⧉</button></div><p class="modal-help">ⓘ الأمر لا يُنفّذ داخل الموقع. يستخدم في المختبر المملوك لك فقط.</p><div class="modal-actions"><a class="primary-button" href="${t.repo}" target="_blank" rel="noreferrer">فتح GitHub ↗</a><button class="outline-button" data-fav="${t.id}">${favorites.includes(t.id)?'★ إزالة من المفضلة':'☆ حفظ الأداة'}</button></div></div></section></div>`}
if(state.palette){const term=state.paletteTerm.toLowerCase();const hits=tools.filter(t=>t.name.toLowerCase().includes(term)||t.desc.toLowerCase().includes(term)).slice(0,5);return `<div class="modal-overlay palette-overlay" data-overlay><section class="palette-dialog" role="dialog" aria-modal="true"><label><span>⌕</span><input id="palette-input" placeholder="اسم أداة أو صفحة..." value="${esc(state.paletteTerm)}"/><kbd>ESC</kbd></label><div class="palette-results"><div class="palette-caption">صفحات المشروع</div>${nav.filter(n=>!term||n.label.includes(term)).map(n=>`<button data-go="${n.id}">${ICONS[n.id]} <span>${n.label}</span>‹</button>`).join('')}<div class="palette-caption">أدوات الأمن السيبراني</div>${hits.map(t=>`<button data-tool="${t.id}">⌘ <span>${t.name}</span>‹</button>`).join('')}</div><div class="palette-footer"><span>⌘ K اختصار البحث</span><span>STAR CYBER RANGE</span></div></section></div>`}
if(state.reset)return `<div class="modal-overlay"><section class="confirm-dialog"><h3>هل تريد مسح التقدم؟</h3><p>سيُحذف سجل التدريب المحلي والمفضلة والملاحظات والمختبرات المسجلة ولا يمكن استعادته.</p><div><button class="outline-button" data-close="1">إلغاء</button><button class="danger-button" data-confirm="1">تأكيد المسح</button></div></section></div>`;return ''}
function render(){if(!nav.some(n=>n.id===state.page))state.page='overview';document.getElementById('app').innerHTML=`<div class="app-shell ${compact?'compact':''} ${motion?'motion-off':''}" dir="rtl">${state.mobile?'<button class="mobile-backdrop" data-mobileclose="1"></button>':''}${sidebar()}<div class="layout-main"><header class="topbar"><div class="top-right"><button class="icon-button mobile-menu-button" data-mobile="1">☰</button><div class="breadcrumb"><span>STAR CYBER RANGE</span><b>‹</b><strong>${nav.find(n=>n.id===state.page)?.label}</strong></div></div><div class="top-actions"><button class="search-launch" data-palette="1">⌕ <span>ابحث عن أداة أو صفحة...</span><kbd>⌘ K</kbd></button><span class="top-separator"></span><div class="workspace-status"><span class="status-pulse"></span> LOCAL WORKSPACE</div><button class="avatar-button" data-go="settings">SK</button></div></header><main class="main-content">${{overview:overview,tools:toolsPage,platforms:platformPage,labs:labsPage,workflows:workflowsPage,reports:reportsPage,settings:settingsPage}[state.page]()}<footer class="site-footer"><span>© 2026 STAR CYBER RANGE <i></i> واجهة تدريبية محلية</span><span>BUILT TO LEARN. DESIGNED TO DEFEND.</span></footer></main></div><nav class="mobile-bottom-nav">${nav.filter(n=>['overview','platforms','labs','reports'].includes(n.id)).map(n=>`<button data-go="${n.id}" class="${state.page===n.id?'active':''}"><span style="font-size:20px">${ICONS[n.id]}</span><span>${n.label}</span></button>`).join('')}</nav>${overlay()}</div>`;if(!motion&&window.gsap){window.gsap.fromTo('[data-animate]',{opacity:0,y:13},{opacity:1,y:0,duration:.48,stagger:.04,ease:'power2.out',clearProps:'all'})}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-tool],[data-fav],[data-weekgo],[data-expand],[data-complete],[data-category],[data-resetfilters],[data-workflow],[data-copyworkflow],[data-copy],[data-export],[data-toggle],[data-reset],[data-confirm],[data-close],[data-mobile],[data-mobileclose],[data-palette],[data-overlay],[data-platformfilter],[data-platformselect],[data-targetdelete],[data-targetcopy]');if(!t)return;const d=t.dataset;if(d.go){go(d.go)}else if(d.platformfilter){state.platformFilter=d.platformfilter;render()}else if(d.platformselect){state.targetPlatform=d.platformselect;render();document.getElementById('register-lab')?.scrollIntoView({behavior:'smooth'})}else if(d.targetdelete){targets=targets.filter(x=>x.id!==d.targetdelete);save();render()}else if(d.targetcopy){copy(targets.find(x=>x.id===d.targetcopy)?.endpoint||'')}else if(d.tool){state.tool=d.tool;state.palette=false;render()}else if(d.fav){toggleFav(d.fav)}else if(d.weekgo){state.expanded=+d.weekgo;go('labs')}else if(d.expand){state.expanded=state.expanded===+d.expand?0:+d.expand;render()}else if(d.complete){toggleWeek(+d.complete)}else if(d.category){state.category=d.category;render()}else if(d.resetfilters!==undefined){state.term='';state.category='all';render()}else if(d.workflow){state.workflow=d.workflow;render()}else if(d.copyworkflow){let w=workflows.find(x=>x.id===d.copyworkflow);copy(w.tools.map((id,i)=>`${i+1}. ${tools.find(x=>x.id===id)?.name}`).join('\n'))}else if(d.copy){copy(tools.find(x=>x.id===d.copy)?.command||'')}else if(d.export){if(d.export==='md')dl('STAR-Cyber-Range-Report.md',markdown(),'text/markdown');else dl('STAR-Cyber-Range-Data.json',JSON.stringify({completed_weeks:completed,favorite_tools:favorites,notes,assigned_labs:targets,disclaimer:'Local training data only; assigned targets unverified'},null,2),'application/json')}else if(d.toggle){if(d.toggle==='motion')motion=!motion;else compact=!compact;save();render()}else if(d.reset){state.reset=true;render()}else if(d.confirm){completed=[];favorites=[];notes='';targets=[];state.reset=false;save();render();toast('تم مسح سجل التدريب المحلي')}else if(d.close){state.tool=null;state.palette=false;state.reset=false;render()}else if(d.mobile){state.mobile=true;render()}else if(d.mobileclose){state.mobile=false;render()}else if(d.palette){state.palette=true;state.paletteTerm='';render();document.getElementById('palette-input')?.focus()}else if(d.overlay&&e.target===t){state.tool=null;state.palette=false;render()}});
document.addEventListener('input',e=>{if(e.target.id==='tool-search'){const pos=e.target.selectionStart;state.term=e.target.value;render();const n=document.getElementById('tool-search');n?.focus();n?.setSelectionRange(pos,pos)}else if(e.target.id==='palette-input'){state.paletteTerm=e.target.value;render();let n=document.getElementById('palette-input');n?.focus();n?.setSelectionRange(n.value.length,n.value.length)}else if(e.target.id==='notes-field'){notes=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.id==='target-platform'){state.targetPlatform=e.target.value;render();document.getElementById('register-lab')?.scrollIntoView({block:'start'});}if(e.target.matches('[data-targetstatus]')){let item=targets.find(x=>x.id===e.target.dataset.targetstatus);if(item){item.status=e.target.value;save();render()}}});
document.addEventListener('submit',e=>{if(e.target.id!=='target-form')return;e.preventDefault();const form=e.target;const id=form.querySelector('#target-platform').value;const p=platforms.find(x=>x.id===id);const title=form.querySelector('#target-title').value;const endpoint=form.querySelector('#target-endpoint')?.value||'';const err=checkAssignedTarget(p,title,endpoint);if(err){form.querySelector('#target-error').textContent=err;return;}if(!form.querySelector('#target-authorized').checked){form.querySelector('#target-error').textContent='يجب تأكيد تصريح المختبر.';return;}targets.unshift({id:'lab-'+Date.now()+'-'+Math.floor(Math.random()*100000),platformId:id,title:title.trim(),endpoint:p.kind==='defense'?'':endpoint.trim(),createdAt:new Date().toISOString(),status:'planned'});save();render();toast('تم تسجيل المختبر دون تنفيذ فحص');});
window.addEventListener('hashchange',()=>{state.page=location.hash.slice(1)||'overview';render()});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.palette=!state.palette;render();document.getElementById('palette-input')?.focus()}if(e.key==='Escape'){state.palette=false;state.tool=null;state.reset=false;state.mobile=false;render()}});
render();
</script></body></html>
