# Localhost-only reverse proxy from the Kali host into the isolated range.
# Upstreams are resolved at request time (Docker DNS), so the gateway starts
# even when a target is stopped; a stopped target simply answers 502.
worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 20m;
  server_tokens off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $http_host;
  proxy_read_timeout 300s;

  server {
    listen 3000;
    location / { set $up http://juice-shop:3000; proxy_pass $up; }
  }
  server {
    listen 4280;
    location / { set $up http://dvwa:80; proxy_pass $up; }
  }
  server {
    listen 8081;
    location / { set $up http://webgoat:8080; proxy_pass $up; }
  }
}
