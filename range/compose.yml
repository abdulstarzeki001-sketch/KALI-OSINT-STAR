# KALI-OSINT-STAR training range — deliberately vulnerable targets.
#
# Isolation model
#   * Every target sits ONLY on `range_internal` (internal: true): Docker gives
#     that network no route to the host's uplink, so targets cannot reach the
#     internet, your LAN, or anything outside this compose project.
#   * The `gateway` (nginx) is the only bridge between the internal network and
#     your Kali host. It publishes ports on 127.0.0.1 ONLY — never 0.0.0.0 — so
#     nothing on your network or the internet can reach the targets.
#   * Targets are started one at a time through the Range Manager API and are
#     recreated from the image on every start/reset: no state survives.
#
# Never change the published addresses to 0.0.0.0, never attach a target to
# `range_edge`, and never run this on a machine reachable from the internet
# without a firewall. These images contain intentionally exploitable software.
#
# Images: tags are pinned; for stronger supply-chain guarantees override them
# with digests (image@sha256:...) through the *_IMAGE variables.

name: kos-range

x-target: &target
  networks: [range_internal]
  restart: "no"
  security_opt: ["no-new-privileges:true"]
  mem_limit: 1g
  pids_limit: 256
  labels:
    kos.range: "target"

networks:
  range_internal:
    internal: true
    ipam:
      config:
        - subnet: 10.77.0.0/24
  range_edge:
    ipam:
      config:
        - subnet: 10.78.0.0/24

services:
  gateway:
    image: ${KOS_GATEWAY_IMAGE:-nginx:1.27-alpine}
    networks: [range_internal, range_edge]
    ports:
      - "127.0.0.1:3000:3000"   # OWASP Juice Shop
      - "127.0.0.1:4280:4280"   # DVWA
      - "127.0.0.1:8081:8081"   # WebGoat
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: "no"
    labels:
      kos.range: "gateway"

  juice-shop:
    <<: *target
    image: ${JUICE_SHOP_IMAGE:-bkimminich/juice-shop:v17.3.0}
    profiles: [juice-shop]
    environment:
      # `ctf` preset shows a flag code in each "challenge solved" notification.
      NODE_ENV: ctf
      # A fresh random key per attempt, injected by the Range Manager. Flags are
      # HMAC-SHA1(CTF_KEY, challenge name), so the API can verify them offline.
      CTF_KEY: ${KOS_JUICE_CTF_KEY:-unset-start-through-range-manager}

  dvwa:
    <<: *target
    image: ${DVWA_IMAGE:-vulnerables/web-dvwa:latest}
    profiles: [dvwa]

  webgoat:
    <<: *target
    image: ${WEBGOAT_IMAGE:-webgoat/webgoat:v2023.8}
    profiles: [webgoat]
    mem_limit: 2g
    environment:
      TZ: UTC
