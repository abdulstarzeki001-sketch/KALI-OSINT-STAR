name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:cloudflare
      - run: npm run test:markdown
      - run: npm run test:ai-core
      - run: npm run test:terminal
      - run: node --test tests/theme-navigation.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:bundle
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q

  cyber-ai-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/star-ai-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install agent test dependencies
        run: python -m pip install -r services/agent/requirements.txt pytest pytest-asyncio
      - name: Compile and test STAR CPU agent
        run: |
          python -m compileall -q services/agent
          python -m pytest -q services/agent/tests
