name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:cloudflare
      - run: node --test tests/durable-memory.test.mjs
      - run: node --test tests/ai-settings.test.mjs
      - run: node --test tests/github-workspace.test.mjs
      - run: node --test tests/developer-v2.test.mjs
      - run: node --test tests/engineering-v3.test.mjs
      - run: npm run test:markdown
      - run: npm run test:ai-core
      - run: npm run test:terminal
      - run: node --test tests/terminal-mobile-ui.test.mjs
      - run: node --test tests/cyber-findings-ui.test.mjs
      - run: node --test tests/auto-model-routing.test.mjs
      - run: node --test tests/theme-navigation.test.mjs
      - run: node --test tests/star-os.test.mjs
      - run: node --test tests/access-session.test.mjs
      - run: node --test tests/agent-workbench-ui.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:bundle
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q

  cyber-ai-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/star-ai-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sh -n start.sh
      - run: npm test
      - name: Build real Cyber Gateway Docker image and verify startup
        run: |
          docker build -t star-cyber-gateway-ci .
          docker run -d --rm --name star-cyber-gateway-ci -p 127.0.0.1:18080:8080 star-cyber-gateway-ci
          trap 'docker logs star-cyber-gateway-ci; docker rm -f star-cyber-gateway-ci || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || exit 1

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install agent test dependencies
        run: python -m pip install -r services/agent/requirements.txt pytest pytest-asyncio
      - name: Compile and test STAR CPU agent
        run: |
          python -m compileall -q services/agent
          python -m pytest -q services/agent/tests

  vps-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Ubuntu bootstrap shell syntax
        run: bash -n deploy/cpu-ai/install-ubuntu.sh
      - name: Validate Compose model and agent configurations
        env:
          STAR_CPU_API_KEY: secure-unit-test-cpu-key-not-a-real-secret-00000
          STAR_AGENT_API_KEY: secure-unit-test-agent-key-not-a-real-secret-0000
        run: |
          mkdir -p deploy/cpu-ai/workspace
          docker compose -f deploy/cpu-ai/compose.yaml -f deploy/cpu-ai/compose.agent.yaml config --quiet
