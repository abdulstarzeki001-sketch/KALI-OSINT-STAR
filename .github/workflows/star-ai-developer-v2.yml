name: STAR Autonomous Developer V2
run-name: STAR V2 ${{ github.event.client_payload.id }}
on:
  repository_dispatch:
    types: [star-ai-v2-approved-edit]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: star-v2-${{ github.event.client_payload.id }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'abdulstarzeki001-sketch/KALI-OSINT-STAR' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply approved file set atomically without executing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/star-developer-v2.mjs
