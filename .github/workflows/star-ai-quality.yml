name: STAR AI Quality
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, star-ai-opencode-local, star-ai-verified-engineering]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Run fixed engineering quality suites
        run: python -m scripts.engineering_runner
      - name: Upload metadata-only engineering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: star-engineering-evidence
          path: star-engineering-evidence.json
          if-no-files-found: error
          retention-days: 7
