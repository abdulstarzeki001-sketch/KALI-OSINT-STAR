name: STAR AI Quality
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, star-ai-opencode-local, star-ai-verified-engineering]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run fixed engineering quality suites
        run: python -m scripts.engineering_runner
      - name: Upload metadata-only engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-engineering-evidence
          path: star-engineering-evidence.json
          if-no-files-found: error
          retention-days: 7
