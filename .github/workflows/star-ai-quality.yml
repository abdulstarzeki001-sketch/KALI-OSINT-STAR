name: STAR AI Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [star-ai-opencode-local]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v scripts.test_star_ai_quality
      - run: python -m json.tool opencode.json > /dev/null
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test apps/web/tests/quality-report.test.mjs
